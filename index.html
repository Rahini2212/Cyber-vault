<!DOCTYPE html>
<html>
<head>
    <title>CyberVault - Digital Security Locker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #080b16, #111a33);
            color: white;
            text-align: center;
            min-height: 100vh;
            padding: 40px 15px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #aab3c5;
            margin-bottom: 30px;
        }

        .box {
            width: 360px;
            max-width: 95%;
            margin: 20px auto;
            padding: 30px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.4);
        }

        input, textarea {
            width: 100%;
            padding: 13px;
            margin: 8px 0;
            border: none;
            border-radius: 9px;
            background: #f1f3f7;
            color: #111;
        }

        textarea {
            height: 120px;
            resize: none;
        }

        button {
            padding: 12px 20px;
            margin: 7px;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            font-weight: bold;
            background: #ffffff;
            color: #111;
        }

        button:hover {
            transform: scale(1.03);
        }

        .dashboard {
            display: none;
        }

        .locker,
        .notes,
        .security {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: rgba(255,255,255,0.06);
            border-radius: 15px;
        }

        .result {
            margin-top: 15px;
            font-weight: bold;
        }

        .feature {
            display: inline-block;
            width: 30%;
            min-width: 150px;
            margin: 10px;
            padding: 20px;
            background: rgba(255,255,255,0.07);
            border-radius: 15px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 32px;
            }

            .feature {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <h1>🔐 CyberVault</h1>
    <p class="subtitle">Your Digital Security Locker</p>

    <!-- LOGIN -->
    <div class="box" id="loginBox">
        <h2>Login</h2>

        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">

        <button onclick="login()">Unlock 🔓</button>

        <p id="loginMessage"></p>
    </div>

    <!-- DASHBOARD -->
    <div class="box dashboard" id="dashboard">

        <h2>🛡️ CyberVault Dashboard</h2>
        <p>Welcome to your secure digital space</p>

        <div class="feature">
            <h3>🔐 Locker</h3>
            <button onclick="showSection('locker')">
                Open
            </button>
        </div>

        <div class="feature">
            <h3>📝 Notes</h3>
            <button onclick="showSection('notes')">
                Open
            </button>
        </div>

        <div class="feature">
            <h3>🛡️ Security</h3>
            <button onclick="showSection('security')">
                Check
            </button>
        </div>

        <!-- DIGITAL LOCKER -->
        <div class="locker" id="locker">
            <h2>🔐 Digital Locker</h2>
            <p>Store a demo file name here.</p>

            <input type="text" id="fileName" placeholder="Enter file name">

            <button onclick="saveFile()">Save 🔒</button>

            <p id="fileMessage"></p>
        </div>

        <!-- SECURE NOTES -->
        <div class="notes" id="notes">
            <h2>📝 Secure Notes</h2>

            <textarea id="note"
                placeholder="Write your security note..."></textarea>

            <br>

            <button onclick="saveNote()">Save Note 💾</button>

            <p id="noteMessage"></p>
        </div>

        <!-- SECURITY CHECK -->
        <div class="security" id="security">
            <h2>🛡️ Security Check</h2>

            <input type="password"
                id="checkPassword"
                placeholder="Enter a demo password">

            <button onclick="checkPassword()">
                Check Strength
            </button>

            <p class="result" id="securityResult"></p>
        </div>

        <br>

        <button onclick="logout()">Logout 🚪</button>

    </div>

    <script>

        function login() {

            var username =
                document.getElementById("username").value;

            var password =
                document.getElementById("password").value;

            if (username !== "" && password !== "") {

                document.getElementById("loginBox").style.display = "none";

                document.getElementById("dashboard").style.display = "block";

            } else {

                document.getElementById("loginMessage").innerText =
                    "Please enter username and password.";

            }
        }


        function showSection(section) {

            document.getElementById("locker").style.display = "none";
            document.getElementById("notes").style.display = "none";
            document.getElementById("security").style.display = "none";

            document.getElementById(section).style.display = "block";
        }


        function saveFile() {

            var file =
                document.getElementById("fileName").value;

            if (file !== "") {

                document.getElementById("fileMessage").innerText =
                    "🔒 File saved successfully!";

            } else {

                document.getElementById("fileMessage").innerText =
                    "Please enter a file name.";

            }
        }


        function saveNote() {

            var note =
                document.getElementById("note").value;

            if (note !== "") {

                document.getElementById("noteMessage").innerText =
                    "📝 Note saved successfully!";

            } else {

                document.getElementById("noteMessage").innerText =
                    "Please write a note.";

            }
        }


        function checkPassword() {

            var password =
                document.getElementById("checkPassword").value;

            var result =
                document.getElementById("securityResult");

            if (password.length >= 8) {

                result.innerText =
                    "🟢 Strong password";

            } else if (password.length >= 5) {

                result.innerText =
                    "🟡 Medium password";

            } else {

                result.innerText =
                    "🔴 Weak password";

            }
        }


        function logout() {

            document.getElementById("dashboard").style.display = "none";

            document.getElementById("loginBox").style.display = "block";

            document.getElementById("username").value = "";
            document.getElementById("password").value = "";
        }

    </script>

</body>
</html>
